name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      release_confirmed:
        description: Confirm that this commit is ready for production
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  checks:
    name: Run checks before release
    if: ${{ inputs.release_confirmed }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate site
        run: npm run check

  deploy:
    name: Deploy to Vercel
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    defaults:
      run:
        working-directory: dist
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull Vercel production settings
        run: npx --yes vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build production artifacts
        run: npx --yes vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy production artifacts
        id: deploy
        shell: bash
        run: |
          deployment_url="$(npx --yes vercel@latest deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})"
          echo "url=${deployment_url}" >> "$GITHUB_OUTPUT"
          echo "Deployed to ${deployment_url}"
