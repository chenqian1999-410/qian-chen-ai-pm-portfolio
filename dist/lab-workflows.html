<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="可编辑的 AI 工作流搭建页面。"><title>工作流搭建｜Qian Chen AI Learning Lab</title><link rel="stylesheet" href="lab.css"></head>
<body>
  <nav class="nav"><div class="wrap nav-inner"><a class="brand" href="index.html#lab"><span class="brand-mark">Q</span><span>QIAN CHEN · AI LEARNING LAB</span></a><div class="nav-actions"><a href="lab-skills.html">技能库</a><a class="back" href="index.html#lab">返回作品集 ↙</a></div></div></nav>
  <header class="wrap hero"><div class="section-no">03</div><div><span class="eyebrow">Reusable assets / Workflow</span><h1>工作流搭建</h1><p class="lead">从空白流程开始添加节点。节点会按顺序排列，并保存在当前浏览器中。</p><div class="lab-nav"><a class="chip" href="lab-skills.html">技能库</a><a class="chip" href="lab-spec-kit.html">AI 场景规格包</a><a class="chip active" href="lab-workflows.html">工作流搭建</a><a class="chip" href="lab-evaluation.html">评测集</a><a class="chip" href="idea-garden.html">Idea Garden</a></div></div></header>
  <main class="wrap"><div class="workspace">
    <aside class="toolbox paper"><span class="eyebrow">Add a node</span><h2>添加流程节点</h2><p>写下节点名称和它负责的任务。</p><form id="node-form"><div class="field"><label for="node-name">节点名称</label><input id="node-name" required placeholder="例如：输入解析"></div><div class="field"><label for="node-note">节点说明</label><textarea id="node-note" placeholder="这个节点做什么？"></textarea></div><button class="btn" type="submit">添加节点 ＋</button></form><div class="button-row" style="margin-top:15px"><button class="btn light" id="remove-last" type="button">撤回最后一个</button><button class="btn danger" id="clear" type="button">清空流程</button></div></aside>
    <section class="canvas paper"><div class="panel-title"><div><span class="eyebrow">Workflow canvas</span><h2>空白工作流</h2></div></div><div class="flow-canvas" id="flow" aria-live="polite"></div></section>
  </div></main>
  <footer class="footer"><div class="wrap footer-inner"><span>QIAN CHEN · AI LEARNING LAB</span><a href="index.html#lab">BACK TO PORTFOLIO ↗</a></div></footer>
  <script>
    const key='qian-ai-lab-workflow-v1',form=document.querySelector('#node-form'),flow=document.querySelector('#flow');let nodes=JSON.parse(localStorage.getItem(key)||'[]');
    function save(){localStorage.setItem(key,JSON.stringify(nodes))}function render(){if(!nodes.length){flow.innerHTML='<div class="empty" style="width:100%;min-height:270px"><div><span class="empty-mark">＋</span><strong>还没有节点</strong><span>从左侧添加第一个流程节点</span></div></div>';return}flow.innerHTML=nodes.map((node,i)=>`${i?'<span class="flow-arrow" aria-hidden="true">→</span>':''}<div class="flow-node"><b>${escapeHTML(node.name)}</b><small>${escapeHTML(node.note||'—')}</small></div>`).join('')}
    function escapeHTML(value){const el=document.createElement('div');el.textContent=value;return el.innerHTML}
    form.addEventListener('submit',event=>{event.preventDefault();nodes.push({name:form.elements['node-name'].value.trim(),note:form.elements['node-note'].value.trim()});save();render();form.reset()});
    document.querySelector('#remove-last').addEventListener('click',()=>{nodes.pop();save();render()});document.querySelector('#clear').addEventListener('click',()=>{nodes=[];localStorage.removeItem(key);render()});render();
  </script>
</body></html>
