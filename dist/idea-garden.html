<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="用于记录新产品需求观察的可编辑 Idea Garden。"><title>Idea Garden｜Qian Chen AI Learning Lab</title><link rel="stylesheet" href="lab.css"></head>
<body>
  <nav class="nav"><div class="wrap nav-inner"><a class="brand" href="index.html#lab"><span class="brand-mark">Q</span><span>QIAN CHEN · AI LEARNING LAB</span></a><div class="nav-actions"><a href="lab-skills.html">技能库</a><a class="back" href="index.html#lab">返回作品集 ↙</a></div></div></nav>
  <header class="wrap hero"><div class="section-no">05</div><div><span class="eyebrow">Idea Garden / 灵感花园</span><h1>让新的需求观察，<br>从这里开始。</h1><p class="lead">这是一个空白的创意需求发现板。新的用户观察、问题线索和项目想法可以随时贴上来，再继续编辑和整理。</p><div class="lab-nav"><a class="chip" href="lab-skills.html">技能库</a><a class="chip" href="lab-spec-kit.html">AI 场景规格包</a><a class="chip" href="lab-workflows.html">工作流搭建</a><a class="chip" href="lab-evaluation.html">评测集</a><a class="chip active" href="idea-garden.html">Idea Garden</a></div></div></header>
  <main class="wrap"><div class="garden-layout">
    <aside class="toolbox paper"><span class="eyebrow">New observation</span><h2 id="form-title">贴一张新便签</h2><p>只记录新的观察和想法，不预置已有项目内容。</p><form id="idea-form"><input id="edit-index" type="hidden" value=""><div class="field"><label for="idea-title">需求观察</label><input id="idea-title" required placeholder="一句话写下需求点"></div><div class="field"><label for="idea-detail">补充说明</label><textarea id="idea-detail" placeholder="来自谁、发生在哪里、为什么值得继续观察？"></textarea></div><div class="field"><label for="idea-source">线索来源</label><input id="idea-source" placeholder="访谈 / 工作流 / 日常观察…"></div><button class="btn" id="submit" type="submit">贴到花园 ＋</button></form><button class="btn light" id="cancel" type="button" style="display:none;margin-top:12px">取消编辑</button><button class="btn danger" id="clear" type="button" style="margin-top:12px">清空花园</button></aside>
    <section class="garden-board" id="garden" aria-live="polite"></section>
  </div></main>
  <footer class="footer"><div class="wrap footer-inner"><span>NEEDS BEFORE FEATURES</span><a href="index.html#lab">BACK TO PORTFOLIO ↗</a></div></footer>
  <script>
    const key='qian-ai-idea-garden-v1',form=document.querySelector('#idea-form'),garden=document.querySelector('#garden'),cancel=document.querySelector('#cancel');let ideas=JSON.parse(localStorage.getItem(key)||'[]');
    const esc=value=>{const el=document.createElement('div');el.textContent=value;return el.innerHTML};const save=()=>localStorage.setItem(key,JSON.stringify(ideas));
    function resetForm(){form.reset();document.querySelector('#edit-index').value='';document.querySelector('#form-title').textContent='贴一张新便签';document.querySelector('#submit').textContent='贴到花园 ＋';cancel.style.display='none'}
    function render(){if(!ideas.length){garden.innerHTML='<div class="garden-empty"><div><span class="plus">＋</span><strong>Idea Garden 还是空白的</strong><br><span>发现新的用户需求或项目线索时，把第一张便签贴在这里。</span></div></div>';return}garden.innerHTML=ideas.map((item,i)=>`<article class="garden-note" style="--tilt:${i%2?'.7deg':'-.8deg'}"><small>${esc((item.source||'NEW OBSERVATION').toUpperCase())}</small><h3>${esc(item.title)}</h3><p>${esc(item.detail||'')}</p><div class="card-actions"><button type="button" data-edit="${i}">编辑</button><button class="remove" type="button" data-remove="${i}">删除</button></div></article>`).join('')}
    form.addEventListener('submit',event=>{event.preventDefault();const item={title:document.querySelector('#idea-title').value.trim(),detail:document.querySelector('#idea-detail').value.trim(),source:document.querySelector('#idea-source').value.trim()};const index=document.querySelector('#edit-index').value;if(index==='')ideas.push(item);else ideas[Number(index)]=item;save();render();resetForm()});
    garden.addEventListener('click',event=>{if(event.target.dataset.edit!==undefined){const i=Number(event.target.dataset.edit),item=ideas[i];document.querySelector('#edit-index').value=i;document.querySelector('#idea-title').value=item.title;document.querySelector('#idea-detail').value=item.detail;document.querySelector('#idea-source').value=item.source;document.querySelector('#form-title').textContent='编辑这张便签';document.querySelector('#submit').textContent='保存修改';cancel.style.display='inline-block';window.scrollTo({top:0,behavior:'smooth'})}if(event.target.dataset.remove!==undefined){ideas.splice(Number(event.target.dataset.remove),1);save();render();resetForm()}});
    cancel.addEventListener('click',resetForm);document.querySelector('#clear').addEventListener('click',()=>{ideas=[];localStorage.removeItem(key);render();resetForm()});render();
  </script>
</body></html>
