<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="可编辑的 AI 产品评测集页面。"><title>评测集｜Qian Chen AI Learning Lab</title><link rel="stylesheet" href="lab.css"></head>
<body>
  <nav class="nav"><div class="wrap nav-inner"><a class="brand" href="index.html#lab"><span class="brand-mark">Q</span><span>QIAN CHEN · AI LEARNING LAB</span></a><div class="nav-actions"><a href="lab-skills.html">技能库</a><a class="back" href="index.html#lab">返回作品集 ↙</a></div></div></nav>
  <header class="wrap hero"><div class="section-no">04</div><div><span class="eyebrow">Reusable assets / Evaluation Set</span><h1>评测集</h1><p class="lead">用于记录新的测试样本、预期结果和实际结果。页面初始为空，内容保存在当前浏览器。</p><div class="lab-nav"><a class="chip" href="lab-skills.html">技能库</a><a class="chip" href="lab-spec-kit.html">AI 场景规格包</a><a class="chip" href="lab-workflows.html">工作流搭建</a><a class="chip active" href="lab-evaluation.html">评测集</a><a class="chip" href="idea-garden.html">Idea Garden</a></div></div></header>
  <main class="wrap"><div class="workspace">
    <aside class="toolbox paper"><span class="eyebrow">New test case</span><h2>新增样本</h2><form id="case-form"><div class="field"><label for="case-input">测试输入</label><textarea id="case-input" required></textarea></div><div class="field"><label for="case-expected">预期结果</label><textarea id="case-expected" required></textarea></div><div class="field"><label for="case-actual">实际结果</label><textarea id="case-actual"></textarea></div><div class="field"><label for="case-status">状态</label><select id="case-status"><option value="待评测">待评测</option><option value="通过">通过</option><option value="Bad Case">Bad Case</option></select></div><button class="btn" type="submit">加入评测集 ＋</button></form><button class="btn danger" id="clear" type="button" style="margin-top:15px">清空评测集</button></aside>
    <section class="canvas paper"><div class="panel-title"><div><span class="eyebrow">Evaluation workspace</span><h2>测试样本</h2></div><span class="eyebrow" id="count">0 CASES</span></div><div id="table-wrap"></div></section>
  </div></main>
  <footer class="footer"><div class="wrap footer-inner"><span>QIAN CHEN · AI LEARNING LAB</span><a href="index.html#lab">BACK TO PORTFOLIO ↗</a></div></footer>
  <script>
    const key='qian-ai-lab-eval-v1',form=document.querySelector('#case-form'),wrap=document.querySelector('#table-wrap'),count=document.querySelector('#count');let cases=JSON.parse(localStorage.getItem(key)||'[]');
    const esc=value=>{const el=document.createElement('div');el.textContent=value;return el.innerHTML};function save(){localStorage.setItem(key,JSON.stringify(cases))}
    function render(){count.textContent=`${cases.length} CASE${cases.length===1?'':'S'}`;if(!cases.length){wrap.innerHTML='<div class="empty"><div><span class="empty-mark">＋</span><strong>评测集还是空的</strong><span>从左侧添加第一条测试样本</span></div></div>';return}wrap.innerHTML=`<table class="eval-table"><thead><tr><th>#</th><th>测试输入</th><th>预期结果</th><th>实际结果</th><th>状态</th><th></th></tr></thead><tbody>${cases.map((item,i)=>`<tr><td>${String(i+1).padStart(2,'0')}</td><td>${esc(item.input)}</td><td>${esc(item.expected)}</td><td>${esc(item.actual||'—')}</td><td><span class="status ${item.status==='通过'?'pass':item.status==='Bad Case'?'fail':''}">${esc(item.status)}</span></td><td><button class="btn danger" type="button" data-remove="${i}">删除</button></td></tr>`).join('')}</tbody></table>`}
    form.addEventListener('submit',event=>{event.preventDefault();cases.push({input:document.querySelector('#case-input').value.trim(),expected:document.querySelector('#case-expected').value.trim(),actual:document.querySelector('#case-actual').value.trim(),status:document.querySelector('#case-status').value});save();render();form.reset()});
    wrap.addEventListener('click',event=>{const index=event.target.dataset.remove;if(index!==undefined){cases.splice(Number(index),1);save();render()}});document.querySelector('#clear').addEventListener('click',()=>{cases=[];localStorage.removeItem(key);render()});render();
  </script>
</body></html>
