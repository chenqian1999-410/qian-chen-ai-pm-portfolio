<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="三个 AI 产品项目的流程图画板：营销、建筑强排与节水花园设计。">
  <title>AI 产品流程图画板 | 钱宸</title>
  <style>
    :root{--paper:#f7f2e9;--ink:#20211e;--muted:#62645d;--coral:#d75a45;--coral-soft:#f4d7cc;--line:#cfc5b5}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}button,a{touch-action:manipulation}a{color:inherit}
    .ux-page-head{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:17px clamp(18px,3vw,46px);border-bottom:1px solid var(--line)}.ux-page-head a{font-weight:800;text-decoration:none}.ux-page-head a:hover{text-decoration:underline;text-underline-offset:4px}.ux-page-head span{font:800 11px ui-monospace,monospace;letter-spacing:.1em;color:var(--coral)}
    .ux-page-intro{display:flex;justify-content:space-between;gap:26px;align-items:end;padding:38px clamp(18px,3vw,46px) 30px}.ux-page-intro small{font:800 11px ui-monospace,monospace;letter-spacing:.1em;color:var(--coral)}.ux-page-intro h1{font:600 clamp(34px,4vw,56px)/1.08 Georgia,"Songti SC",serif;margin:9px 0 13px}.ux-page-intro p{margin:0;max-width:690px;color:var(--muted);line-height:1.6}.ux-page-intro>a{white-space:nowrap;font-weight:800;text-underline-offset:4px}
    .ux-board-inline{position:relative;margin-top:14px;border:1px solid var(--ink);background:#eeece7;box-shadow:6px 7px 0 var(--coral-soft);scroll-margin-top:90px}
    .ux-toolbar{height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;border-bottom:1px solid #c5c3bd;background:#faf9f6}.ux-toolbar strong{font:800 11px ui-monospace,monospace;letter-spacing:.08em}.ux-toolbar-actions{display:flex;align-items:center;gap:6px}.ux-toolbar button,.ux-viewer-controls button{border:1px solid #aaa9a3;background:white;border-radius:5px;padding:6px 10px;min-width:33px;font-weight:800;cursor:pointer}.ux-toolbar button:hover,.ux-toolbar button:focus-visible,.ux-viewer-controls button:hover,.ux-viewer-controls button:focus-visible{border-color:var(--coral);outline-color:var(--coral)}.ux-zoom-label{font:700 11px ui-monospace,monospace;min-width:44px;text-align:center}
    .ux-viewport{height:min(72vh,760px);min-height:460px;position:relative;overflow:hidden;cursor:grab;touch-action:none;background-color:#ecebe7;background-image:radial-gradient(#bbb9b3 1px,transparent 1px);background-size:24px 24px;background-position:var(--grid-x,0px) var(--grid-y,0px)}.ux-viewport.dragging{cursor:grabbing}.ux-stage{position:absolute;left:0;top:0;width:1850px;height:1260px;transform-origin:0 0}
    .ux-board-card{position:absolute;margin:0;padding:12px;background:#fffdf9;border:1px solid #b7b6af;box-shadow:6px 8px 0 rgba(56,54,49,.13);cursor:zoom-in;transition:box-shadow .2s}.ux-board-card:hover,.ux-board-card:focus-visible{box-shadow:8px 11px 0 rgba(215,90,69,.25);outline:2px solid var(--coral)}.ux-board-card figcaption{font:800 15px/1.35 Arial,"PingFang SC",sans-serif;margin:2px 0 10px}.ux-board-card .num{font:900 11px ui-monospace,monospace;color:var(--coral);margin-right:9px}.ux-board-card img{width:100%;height:auto;display:block;background:#fff}.ux-board-card .note{display:block;padding-top:10px;color:#64645e;font-size:12px;line-height:1.4}.ux-card-one{left:55px;top:70px;width:520px}.ux-card-two{left:665px;top:70px;width:520px}.ux-card-three{left:1275px;top:70px;width:520px}
    .ux-board-footer{display:flex;gap:14px;justify-content:space-between;flex-wrap:wrap;padding:11px 16px;border-top:1px solid #c5c3bd;font-size:12px;color:var(--muted);background:#faf9f6}
    .ux-viewer[hidden]{display:none}.ux-viewer{position:fixed;inset:0;z-index:100;background:rgba(23,24,22,.9);display:flex;flex-direction:column}.ux-viewer-head{display:flex;align-items:center;justify-content:space-between;gap:15px;color:white;padding:14px 20px}.ux-viewer-head h2{font-size:16px;margin:0}.ux-viewer-head-actions{display:flex;align-items:center;gap:16px}.ux-viewer-head a{color:white;font-size:12px;font-weight:700;text-underline-offset:4px}.ux-viewer-head button{border:1px solid #fff;background:transparent;color:#fff;padding:7px 12px;cursor:pointer}.ux-viewer-scroll{flex:1;overflow:auto;text-align:center;padding:24px;scrollbar-color:#aaa #333}.ux-viewer-scroll img{display:block;width:var(--image-width,auto);max-width:none;height:auto;margin:auto;background:white}.ux-viewer-controls{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;background:#272825;color:#fff}.ux-viewer-controls span{font:700 12px ui-monospace,monospace;min-width:46px;text-align:center}
    @media(max-width:700px){.ux-viewport{height:60vh;min-height:420px}.ux-board-footer{font-size:11px}.ux-toolbar strong{font-size:9px}}

    .ux-board-inline{margin:0 clamp(18px,3vw,46px) 42px}
    @media(max-width:700px){.ux-page-head span{display:none}.ux-page-intro{display:block}.ux-page-intro>a{display:inline-block;margin-top:15px}}
  </style>
</head>
<body>
  <header class="ux-page-head"><a href="index.html#work">← 返回精选项目</a><span>QIAN CHEN · PRODUCT FLOW NOTES</span></header>
  <main>
    <div class="ux-page-intro"><div><small>SELECTED WORK · PROCESS MAPS</small><h1>AI 产品流程图画板</h1><p>营销方案、建筑强排与节水花园三个项目的工作流程。拖动画板浏览，点击任意图查看完整原图。</p></div></div>
          <div class="ux-board-inline" id="ux-board" aria-label="三个 AI 产品项目流程图画板">
            <div class="ux-toolbar"><strong>AI PRODUCT / WORKFLOW MAPS</strong><div class="ux-toolbar-actions"><button id="ux-zoom-out" type="button" aria-label="缩小画板">−</button><span class="ux-zoom-label" id="ux-zoom-label">100%</span><button id="ux-zoom-in" type="button" aria-label="放大画板">＋</button><button id="ux-reset" type="button">适配全部</button></div></div>
            <div class="ux-viewport" id="ux-viewport" aria-label="可拖动和缩放的设计画板"><div class="ux-stage" id="ux-stage">
              <figure class="ux-board-card ux-card-one" tabindex="0" role="button" aria-label="放大查看营销方案助手流程图" data-title="01 · 智能营销方案助手" data-src="assets/flows/frame-1.png"><figcaption><span class="num">01</span>智能营销方案助手</figcaption><img src="assets/flows/frame-1.png" alt="智能营销方案助手完整流程图" width="1716" height="3592"><span class="note">需求分析、资料整合、机会判断与方案生成。</span></figure>
              <figure class="ux-board-card ux-card-two" tabindex="0" role="button" aria-label="放大查看强排方案决策流程图" data-title="02 · 强排方案决策 Agent" data-src="assets/flows/frame-2.png"><figcaption><span class="num">02</span>强排方案决策 Agent</figcaption><img src="assets/flows/frame-2.png" alt="建筑强排方案决策 Agent 完整流程图" width="1716" height="3592"><span class="note">资料解析、约束结构化、方案推演与审核。</span></figure>
              <figure class="ux-board-card ux-card-three" tabindex="0" role="button" aria-label="放大查看节水花园设计流程图" data-title="03 · GardenWise AI" data-src="assets/flows/frame-3.png"><figcaption><span class="num">03</span>GardenWise AI · 节水花园设计</figcaption><img src="assets/flows/frame-3.png" alt="节水花园设计助手完整流程图" width="1716" height="3592"><span class="note">需求确认、植物知识检索与方案生成。</span></figure>
            </div></div><div class="ux-board-footer"><span>拖动画板 · 滚轮缩放 · 点击图片查看细节</span><span>03 张项目流程图 · PNG 原图</span></div>
          </div>
  </main>
  <div class="ux-viewer" id="ux-viewer" hidden role="dialog" aria-modal="true" aria-labelledby="ux-viewer-title"><div class="ux-viewer-head"><h2 id="ux-viewer-title"></h2><div class="ux-viewer-head-actions"><a id="ux-original-link" href="assets/flows/frame-1.png" target="_blank" rel="noopener">打开原始 PNG ↗</a><button type="button" id="ux-viewer-close" aria-label="关闭图片">关闭 ×</button></div></div><div class="ux-viewer-scroll" id="ux-viewer-scroll"><img id="ux-viewer-image" alt=""></div><div class="ux-viewer-controls"><button type="button" id="ux-image-out" aria-label="缩小图片">−</button><span id="ux-image-zoom">100%</span><button type="button" id="ux-image-in" aria-label="放大图片">＋</button><button type="button" id="ux-image-fit">适配屏幕</button></div></div>
  <script>
    const uxViewport=document.querySelector('#ux-viewport'),uxStage=document.querySelector('#ux-stage'),uxLabel=document.querySelector('#ux-zoom-label');
    let uxScale=1,uxX=0,uxY=0,uxDrag=null,uxWasDragged=false;
    const uxClamp=(n,min,max)=>Math.max(min,Math.min(max,n));
    function uxDraw(){uxStage.style.transform=`translate(${uxX}px,${uxY}px) scale(${uxScale})`;uxLabel.textContent=`${Math.round(uxScale*100)}%`;uxViewport.style.setProperty('--grid-x',`${uxX%24}px`);uxViewport.style.setProperty('--grid-y',`${uxY%24}px`)}
    function uxFit(){uxScale=uxClamp(Math.min((uxViewport.clientWidth-60)/1850,(uxViewport.clientHeight-60)/1260),.1,1);uxX=(uxViewport.clientWidth-1850*uxScale)/2;uxY=30;uxDraw()}
    function uxZoom(factor,cx=uxViewport.clientWidth/2,cy=uxViewport.clientHeight/2){const next=uxClamp(uxScale*factor,.1,2.5),ratio=next/uxScale;uxX=cx-(cx-uxX)*ratio;uxY=cy-(cy-uxY)*ratio;uxScale=next;uxDraw()}
    document.querySelector('#ux-zoom-in').onclick=()=>uxZoom(1.2);document.querySelector('#ux-zoom-out').onclick=()=>uxZoom(1/1.2);document.querySelector('#ux-reset').onclick=uxFit;
    uxViewport.addEventListener('wheel',e=>{e.preventDefault();const r=uxViewport.getBoundingClientRect();uxZoom(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top)},{passive:false});
    uxViewport.addEventListener('pointerdown',e=>{if(e.button!==0)return;uxDrag={id:e.pointerId,px:e.clientX,py:e.clientY,sx:e.clientX,sy:e.clientY};uxWasDragged=false;uxViewport.setPointerCapture(e.pointerId);uxViewport.classList.add('dragging')});
    uxViewport.addEventListener('pointermove',e=>{if(!uxDrag||uxDrag.id!==e.pointerId)return;uxX+=e.clientX-uxDrag.px;uxY+=e.clientY-uxDrag.py;uxDrag.px=e.clientX;uxDrag.py=e.clientY;if(Math.abs(e.clientX-uxDrag.sx)+Math.abs(e.clientY-uxDrag.sy)>5)uxWasDragged=true;uxDraw()});
    function uxEndDrag(){uxDrag=null;uxViewport.classList.remove('dragging')}uxViewport.addEventListener('pointerup',uxEndDrag);uxViewport.addEventListener('pointercancel',uxEndDrag);
    const uxViewer=document.querySelector('#ux-viewer'),uxViewerImage=document.querySelector('#ux-viewer-image'),uxViewerTitle=document.querySelector('#ux-viewer-title'),uxViewerScroll=document.querySelector('#ux-viewer-scroll');let uxImageScale=1,uxImageBase=0,uxLastFocus=null;
    function uxShowImageScale(){uxViewerImage.style.setProperty('--image-width',`${Math.round(uxImageBase*uxImageScale)}px`);document.querySelector('#ux-image-zoom').textContent=`${Math.round(uxImageScale*100)}%`}
    function uxFitImage(){if(!uxImageBase)return;uxImageScale=Math.min(1,(uxViewerScroll.clientWidth-48)/uxImageBase);uxShowImageScale();uxViewerScroll.scrollTo(0,0)}
    uxViewerImage.addEventListener('load',()=>{uxImageBase=uxViewerImage.naturalWidth;uxFitImage()});
    function uxOpenImage(card){uxLastFocus=card;uxViewerTitle.textContent=card.dataset.title;uxViewerImage.alt=card.querySelector('img').alt;document.querySelector('#ux-original-link').href=card.dataset.src;uxImageBase=0;uxViewer.hidden=false;document.body.style.overflow='hidden';uxViewerImage.src=card.dataset.src;document.querySelector('#ux-viewer-close').focus()}
    function uxCloseImage(){uxViewer.hidden=true;uxViewerImage.removeAttribute('src');document.body.style.overflow='';uxLastFocus?.focus()}
    document.querySelectorAll('.ux-board-card').forEach(card=>{card.addEventListener('click',()=>{if(!uxWasDragged)uxOpenImage(card)});card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();uxOpenImage(card)}})});
    document.querySelector('#ux-viewer-close').onclick=uxCloseImage;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!uxViewer.hidden)uxCloseImage()});
    document.querySelector('#ux-image-in').onclick=()=>{if(!uxImageBase)return;uxImageScale=uxClamp(uxImageScale*1.25,.1,1);uxShowImageScale()};document.querySelector('#ux-image-out').onclick=()=>{if(!uxImageBase)return;uxImageScale=uxClamp(uxImageScale/1.25,.1,1);uxShowImageScale()};document.querySelector('#ux-image-fit').onclick=uxFitImage;
    window.addEventListener('resize',()=>{if(!uxDrag)uxFit()});uxFit();
    const requestedFrame=new URLSearchParams(location.search).get('frame');
    if(['1','2','3'].includes(requestedFrame)){const card=document.querySelector('.ux-card-'+['one','two','three'][Number(requestedFrame)-1]);uxOpenImage(card)}

  </script>
</body>
</html>
